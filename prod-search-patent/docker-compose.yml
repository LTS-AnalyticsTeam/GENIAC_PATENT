version: "3.9"

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: ps-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - ps-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: ps-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    networks:
      - ps-net

  neo4j:
    image: neo4j:5.20-community
    container_name: ps-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4jpass}
      NEO4J_dbms_security_auth__enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    networks:
      - ps-net

  redis:
    image: redis:7.2-alpine
    container_name: ps-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - ps-net

  vectorizer:
    build:
      context: ./services/vectorizer
    container_name: ps-vectorizer
    environment:
      - PORT=9000
    ports:
      - "9000:9000"
    networks:
      - ps-net

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: ps-api
    depends_on:
      - elasticsearch
      - neo4j
      - redis
      - vectorizer
    env_file:
      - .env
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./src:/app/src
    networks:
      - ps-net

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: ps-worker
    depends_on:
      - redis
      - elasticsearch
      - neo4j
    env_file:
      - .env
    command: ["python", "/app/worker.py"]
    volumes:
      - ./src:/app/src
    networks:
      - ps-net

  frontend:
    image: node:20
    container_name: ps-frontend
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 3000"]
    depends_on:
      - api
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    ports:
      - "3000:3000"
    volumes:
      - ./services/frontend:/app
      - frontend-node_modules:/app/node_modules
    networks:
      - ps-net

networks:
  ps-net:
    driver: bridge

volumes:
  es-data:
  neo4j-data:
  neo4j-logs:
  frontend-node_modules:
