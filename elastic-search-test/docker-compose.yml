services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    healthcheck: # ★ 追加 ─ ES が起動完了するまで status=starting
      test:
        [
          "CMD-SHELL",
          "curl -s http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=1s || exit 1",
        ]
      interval: 10s
      retries: 12
      start_period: 20s
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"

  api:
    build: ./app
    container_name: fastapi
    env_file:
      - .env
    environment:
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
    ports:
      - "8000:3000"
    depends_on: # ★ 変更 ─ ES が healthy になるまで待機
      elasticsearch:
        condition: service_healthy

  kibana: # ★ 追加 ─ Elasticsearch 用 UI
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - xpack.security.enabled=false # 開発用なので認証オフ
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es_data:
